name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: python scripts/check_webhook_release.py
      - run: python scripts/check_inbound_release.py
      - run: python scripts/check_inference_release.py
      - run: python scripts/check_agent_release.py
      - run: python scripts/check_durable_agent_release.py
      - run: python scripts/check_multi_agent_release.py
